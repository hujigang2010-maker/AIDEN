<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>杨浦五角场 5km 商办竞品地图｜精简版</title>
  <link rel="stylesheet" href="css/style.css" />

  <!-- 高德地图安全密钥（必须放在 JS API 加载之前） -->
  <script type="text/javascript">
    window._AMapSecurityConfig = {
      securityJsCode: '84da8ce45182a0281c095a358456ab4e'
    };
  </script>
</head>
<body>

  <!-- ============ 顶部总览看板 ============ -->
  <header class="dashboard">
    <div class="dashboard__title">
      <div class="logo">🏢</div>
      <div>
        <h1>杨浦五角场 5km 商办竞品地图<span class="badge">精简版</span></h1>
        <p class="subtitle">
          基准点：<strong id="basePointName">上海市五角场创新创业学院</strong>
          <span class="dot">·</span> 调研半径：<strong>5 km</strong>
          <span class="dot">·</span> 数据更新：<strong id="updateTime">—</strong>
        </p>
      </div>
    </div>

    <div class="dashboard__stats">
      <div class="stat" data-tier="all">
        <div class="stat__num" id="cnt-all">0</div>
        <div class="stat__label">项目总数</div>
      </div>
      <div class="stat tier-1" data-tier="1km">
        <div class="stat__num" id="cnt-1km">0</div>
        <div class="stat__label">1 km 内</div>
      </div>
      <div class="stat tier-2" data-tier="1-2km">
        <div class="stat__num" id="cnt-12">0</div>
        <div class="stat__label">1~2 km</div>
      </div>
      <div class="stat tier-3" data-tier="2-3km">
        <div class="stat__num" id="cnt-23">0</div>
        <div class="stat__label">2~3 km</div>
      </div>
      <div class="stat tier-4" data-tier="3-5km">
        <div class="stat__num" id="cnt-35">0</div>
        <div class="stat__label">3~5 km</div>
      </div>
    </div>
  </header>

  <!-- ============ 主体：地图 + 列表 ============ -->
  <main class="layout">

    <!-- 左侧：地图 -->
    <section class="map-panel">
      <div class="map-toolbar">
        <div class="filter-group">
          <span class="filter-label">业态：</span>
          <button class="chip active" data-filter-cat="all">全部</button>
          <button class="chip" data-filter-cat="商办写字楼">🏢 商办写字楼</button>
          <button class="chip" data-filter-cat="产业园区">🏭 产业园区</button>
          <button class="chip" data-filter-cat="众创空间">💡 众创空间</button>
        </div>
        <div class="filter-group">
          <span class="filter-label">距离：</span>
          <button class="chip active" data-filter-tier="all">全部</button>
          <button class="chip tier-1" data-filter-tier="1km">1 km</button>
          <button class="chip tier-2" data-filter-tier="1-2km">1~2 km</button>
          <button class="chip tier-3" data-filter-tier="2-3km">2~3 km</button>
          <button class="chip tier-4" data-filter-tier="3-5km">3~5 km</button>
        </div>
      </div>
      <div id="map" class="map"></div>
      <div class="map-legend">
        <span class="legend-item"><i class="dot-base"></i> 基准点</span>
        <span class="legend-item"><i class="dot tier-1"></i> 1 km 内</span>
        <span class="legend-item"><i class="dot tier-2"></i> 1~2 km</span>
        <span class="legend-item"><i class="dot tier-3"></i> 2~3 km</span>
        <span class="legend-item"><i class="dot tier-4"></i> 3~5 km</span>
        <span class="legend-item legend-tip">💡 点击地图标记 / 列表行可联动定位</span>
      </div>
    </section>

    <!-- 右侧：数据表 -->
    <section class="list-panel">
      <div class="list-toolbar">
        <div class="search">
          <input id="searchInput" type="text" placeholder="🔎 搜索项目名称 / 地址 / 标签…" />
        </div>
        <div class="list-actions">
          <span id="listCount" class="list-count">共 0 个项目</span>
          <button id="btnExport" class="btn-ghost" title="导出为 CSV">⤓ 导出</button>
          <button id="btnReset" class="btn-ghost" title="重置筛选">↺ 重置</button>
        </div>
      </div>

      <div class="table-wrap">
        <table class="comp-table" id="compTable">
          <thead>
            <tr>
              <th style="width:46px">#</th>
              <th>项目</th>
              <th style="width:96px">业态</th>
              <th style="width:100px">距离</th>
              <th style="width:148px">🚗 驾车</th>
              <th style="width:200px">🚇 公交/地铁</th>
            </tr>
          </thead>
          <tbody id="compTbody"><!-- rendered by JS --></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- ============ 详情面板（点击行/标记弹出） ============ -->
  <aside id="detailPanel" class="detail-panel" hidden>
    <button class="detail-close" id="detailClose" aria-label="关闭">✕</button>
    <div id="detailBody"></div>
  </aside>

  <footer class="site-footer">
    <span>© 杨浦五角场竞品地图 · 数据仅供调研参考</span>
    <span class="footer-dot">·</span>
    <span>地图：高德开放平台</span>
  </footer>

  <!-- 数据 -->
  <script src="data/competitors.js"></script>
  <!-- 高德 JS API -->
  <script src="https://webapi.amap.com/maps?v=2.0&key=b96fe5c5cdb328eceb9a6bf1a6d1af7f"></script>
  <!-- 业务脚本 -->
  <script src="js/app.js"></script>
</body>
</html>
